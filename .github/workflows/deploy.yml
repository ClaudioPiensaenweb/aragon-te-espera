name: Deploy Aragón Te Espera
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Redeploy en Dokploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          curl -s -X POST "http://185.14.58.119:3000/api/compose.redeploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            -d '{"composeId":"ilK0PtYhYLW9d69dRFeBi"}' \
            --fail-with-body
          echo "Redeploy solicitado OK"
