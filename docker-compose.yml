
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
      POSTGRES_DB: directus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U directus
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    build:
      context: .
      dockerfile: Dockerfile.directus
    image: aragon-directus:latest
    ports:
      - "8055:8055"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET: 'aragon-te-espera-secret-key-2024'
      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: 'directus'
      ADMIN_EMAIL: 'admin@piensaenweb.com'
      ADMIN_PASSWORD: 'semaforos'
      ADMIN_TOKEN: 'aragon-admin-token'
      PUBLIC_URL: 'http://localhost:8055'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'http://localhost,http://localhost:3000'
      CORS_CREDENTIALS: 'true'
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus-public/seo-banner.js:/directus/public/seo-banner.js:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8055/server/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "3001:80"
    depends_on:
      - directus
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro

  setup:
    image: node:20-alpine
    depends_on:
      directus:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./public/img:/img:ro
      - ./public:/usr/share/nginx/html
    working_dir: /scripts
    command: node setup-directus.mjs
    restart: "no"

  setup-kit-digital:
    image: node:20-alpine
    depends_on:
      directus:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    working_dir: /scripts
    command: node setup-kit-digital.mjs
    restart: "no"

  robots-sync:
    image: node:20-alpine
    depends_on:
      directus:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./scripts:/scripts:ro
      - ./public:/usr/share/nginx/html
    command: node /scripts/robots-sync.mjs
    restart: unless-stopped

volumes:
  pgdata:
  directus_uploads:
