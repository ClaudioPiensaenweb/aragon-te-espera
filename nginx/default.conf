server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sync trigger → robots-sync (genera sitemap + robots.txt)
    location = /sync {
        proxy_pass http://robots-sync:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # robots.txt & sitemap
    location = /robots.txt { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }
    location = /sitemap.xsl { try_files /sitemap.xsl =404; }

    # Static assets
    location /img/ { try_files $uri =404; }
    location /marca/ { try_files $uri =404; }
    location /css/ { try_files $uri =404; }
    location /js/ { try_files $uri =404; }

    # ===== SPANISH (default) =====
    location = / {
        try_files /index.html =404;
    }
    location = /servicios {
        try_files /servicios.html =404;
    }
    location = /quienes-somos {
        try_files /quienes-somos.html =404;
    }
    location = /colabora {
        try_files /colabora.html =404;
    }
    location = /noticias {
        try_files /blog.html =404;
    }
    location = /aviso-legal {
        try_files /aviso-legal.html =404;
    }
    location = /politica-de-privacidad {
        try_files /politica-de-privacidad.html =404;
    }
    location = /politica-de-cookies {
        try_files /politica-de-cookies.html =404;
    }
    location ~ ^/noticias/categoria/.+ {
        try_files /blog-category.html =404;
    }
    location ~ ^/noticias/.+ {
        try_files /blog-single.html =404;
    }

    # ===== ENGLISH (/en/) =====
    location = /en {
        try_files /en/index.html =404;
    }
    location = /en/ {
        try_files /en/index.html =404;
    }
    location = /en/services {
        try_files /en/services.html =404;
    }
    location = /en/about-us {
        try_files /en/about-us.html =404;
    }
    location = /en/collaborate {
        try_files /en/collaborate.html =404;
    }
    location = /en/news {
        try_files /en/blog.html =404;
    }
    location = /en/legal-notice {
        try_files /en/legal-notice.html =404;
    }
    location = /en/privacy-policy {
        try_files /en/privacy-policy.html =404;
    }
    location = /en/cookie-policy {
        try_files /en/cookie-policy.html =404;
    }
    location ~ ^/en/news/categoria/.+ {
        try_files /en/blog-category.html =404;
    }
    location ~ ^/en/news/.+ {
        try_files /en/blog-single.html =404;
    }

    # SEO Dashboard
    location = /seo-dashboard {
        try_files /seo-dashboard.html =404;
    }

    # Redirect old .html URLs to clean URLs
    location ~ ^(.+)\.html$ {
        return 301 $1;
    }
}
