services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_USER}
      interval: 10s
      timeout: 5s
      retries: 10

  fix-perms:
    image: alpine:3.19
    restart: "no"
    volumes:
      - directus_uploads:/directus/uploads
    command: sh -c "chown -R 1000:1000 /directus/uploads && chmod -R 755 /directus/uploads && echo PERMS_OK"

  directus:
    build:
      context: .
      dockerfile: Dockerfile.directus
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      fix-perms:
        condition: service_completed_successfully
    environment:
      PORT: "8055"
      PUBLIC_URL: "https://admin.aragonteespera.com"
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CORS_ENABLED: "true"
      CORS_ORIGIN: "https://aragonteespera.com,https://www.aragonteespera.com,https://admin.aragonteespera.com"
      CORS_CREDENTIALS: "true"
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus-public/seo-banner.js:/directus/public/seo-banner.js:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8055/server/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aragon-directus.rule=Host(`admin.aragonteespera.com`)"
      - "traefik.http.routers.aragon-directus.entrypoints=websecure"
      - "traefik.http.routers.aragon-directus.tls.certresolver=letsencrypt"
      - "traefik.http.services.aragon-directus.loadbalancer.server.port=8055"
    networks:
      - default
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aragonteespera-front.rule=Host(`aragonteespera.com`) || Host(`www.aragonteespera.com`)"
      - "traefik.http.routers.aragonteespera-front.entrypoints=websecure"
      - "traefik.http.routers.aragonteespera-front.tls.certresolver=letsencrypt"
      - "traefik.http.services.aragonteespera-front.loadbalancer.server.port=80"
    networks:
      - default
      - dokploy-network

  robots-sync:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./public:/usr/share/nginx/html
    command: node /scripts/robots-sync.mjs

volumes:
  pgdata:
  directus_uploads:

networks:
  dokploy-network:
    external: true
