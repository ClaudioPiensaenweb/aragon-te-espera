
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_USER}
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    image: alpine:3.19
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      PLESK_HOST: ${PLESK_HOST}
      PLESK_USER: ${PLESK_USER}
      PLESK_PASS: ${PLESK_PASS}
      PLESK_DB_USER: ${PLESK_DB_USER}
      PLESK_DB_PASS: ${PLESK_DB_PASS}
      PLESK_DB_NAME: ${PLESK_DB_NAME}
    volumes:
      - directus_uploads:/directus/uploads
      - ./scripts/migrate-to-dokploy.sh:/migrate.sh:ro
    command: sh /migrate.sh
    networks:
      - internal

  directus:
    build:
      context: .
      dockerfile: Dockerfile.directus
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8055"
      PUBLIC_URL: "https://admin.aragonteespera.com"
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CORS_ENABLED: "true"
      CORS_ORIGIN: "https://aragonteespera.com,https://www.aragonteespera.com,https://admin.aragonteespera.com"
      CORS_CREDENTIALS: "true"
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus-public/seo-banner.js:/directus/public/seo-banner.js:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8055/server/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aragon-directus.rule=Host(`admin.aragonteespera.com`)"
      - "traefik.http.routers.aragon-directus.tls.certresolver=letsencrypt"
      - "traefik.http.services.aragon-directus.loadbalancer.server.port=8055"
    networks:
      - internal
      - dokploy-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aragon-web.rule=Host(`aragonteespera.com`) || Host(`www.aragonteespera.com`)"
      - "traefik.http.routers.aragon-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.aragon-web.loadbalancer.server.port=80"
    networks:
      - internal
      - dokploy-network

  robots-sync:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./public:/usr/share/nginx/html
    command: node /scripts/robots-sync.mjs
    networks:
      - internal

volumes:
  pgdata:
  directus_uploads:

networks:
  internal:
  dokploy-network:
    external: true
