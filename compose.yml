services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_USER}
      interval: 10s
      timeout: 5s
      retries: 10

  directus:
    build:
      context: .
      dockerfile: Dockerfile.directus
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: "8055"
      PUBLIC_URL: "https://admin.aragonteespera.com"
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CORS_ENABLED: "true"
      CORS_ORIGIN: "https://aragonteespera.com,https://www.aragonteespera.com,https://admin.aragonteespera.com"
      CORS_CREDENTIALS: "true"
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus-public/seo-banner.js:/directus/public/seo-banner.js:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8055/server/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aragon-directus.rule=Host(`admin.aragonteespera.com`)"
      - "traefik.http.routers.aragon-directus.entrypoints=websecure"
      - "traefik.http.routers.aragon-directus.tls.certresolver=letsencrypt"
      - "traefik.http.services.aragon-directus.loadbalancer.server.port=8055"

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aragon-web.rule=Host(`aragonteespera.com`)"
      - "traefik.http.routers.aragon-web.entrypoints=websecure"
      - "traefik.http.routers.aragon-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aragon-web-www.rule=Host(`www.aragonteespera.com`)"
      - "traefik.http.routers.aragon-web-www.entrypoints=websecure"
      - "traefik.http.routers.aragon-web-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aragon-web-www.service=aragon-web"
      - "traefik.http.services.aragon-web.loadbalancer.server.port=80"

  robots-sync:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./public:/usr/share/nginx/html
    command: node /scripts/robots-sync.mjs

volumes:
  pgdata:
  directus_uploads:
